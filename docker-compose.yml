services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fantabasket
      POSTGRES_USER: fantabasket
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets:
      - pg_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./fantabasket-main/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fantabasket"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot-aste-beta:
    build: ./fantabasket-aste-beta
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BOT_TOKEN_FILE: /run/secrets/bot_token_aste_beta
      GLOBALS_PATH: /config/globals.json
      SETTINGS_PATH: /config/settings.json
      TEAMS_PATH: /config/teams.json
      FA_CSV_PATH: /config/fa_players.csv
      DB_PATH: /data/aste.db
      PG_URL: postgresql://fantabasket@postgres/fantabasket
      PG_PASSWORD_FILE: /run/secrets/pg_password
    secrets:
      - bot_token_aste_beta
      - pg_password
    volumes:
      - ./config:/config:ro
      - aste_beta_data:/data
      - ./shared:/app/shared:ro      # regole condivise col bot main (ruoli)

  bot-main:
    build: ./fantabasket-main
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      gas-router:
        condition: service_healthy
    environment:
      BOT_TOKEN_FILE: /run/secrets/bot_token_main
      GLOBALS_PATH: /config/globals.json
      SETTINGS_PATH: /config/settings.json
      TEAMS_PATH: /config/teams.json
      DATABASE_URL: postgresql://fantabasket@postgres/fantabasket
      PG_PASSWORD_FILE: /run/secrets/pg_password
      LOGHI_DIR: /config/loghi
      CONFIG_DIR: /config
      ASTE_DB_PATH: /data_aste/aste.db
      GAS_ROUTER_URL: http://gas-router:8000
      GAS_ROUTER_TOKEN_FILE: /run/secrets/gas_router_token
    env_file:
      - ./secrets/bot_main.env   # HEALTHCHECK_URL=... (fuori da git)
    secrets:
      - bot_token_main
      - pg_password
      - gas_router_token
    volumes:
      - ./config:/config
      - aste_beta_data:/data_aste:ro
      - ./shared:/app/shared:ro      # regole condivise col bot aste (ruoli)
      - ./secrets/cifrati:/secrets_cifrati:ro   # solo il file cifrato da scripts/cifra_secrets.sh, finisce nel backup

  gas-router:
    build: ./gas-router
    restart: unless-stopped
    environment:
      GAS_ROSTER_URL_FILE: /run/secrets/gas_roster_url
      GAS_SCELTE_URL_FILE: /run/secrets/gas_scelte_url
      GAS_TOKEN_FILE: /run/secrets/gas_token
      ROUTER_TOKEN_FILE: /run/secrets/gas_router_token
    secrets:
      - gas_token
      - gas_router_token
      - gas_roster_url
      - gas_scelte_url
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  yahoo-router:
    build: ./yahoo-router
    restart: unless-stopped
    environment:
      YAHOO_CLIENT_ID_FILE: /run/secrets/yahoo_client_id
      YAHOO_CLIENT_SECRET_FILE: /run/secrets/yahoo_client_secret
      ROUTER_TOKEN_FILE: /run/secrets/yahoo_router_token
      YAHOO_TOKEN_PATH: /data/yahoo_token.json
    env_file:
      - ./secrets/yahoo_router.env   # YAHOO_LEAGUE_IDS=... (fuori da git)
    secrets:
      - yahoo_client_id
      - yahoo_client_secret
      - yahoo_router_token
    volumes:
      - yahoo_data:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

secrets:
  bot_token_aste_beta:
    file: ./secrets/bot_token_aste_beta.txt
  bot_token_main:
    file: ./secrets/bot_token_main.txt
  pg_password:
    file: ./secrets/pg_password.txt
  gas_token:
    file: ./secrets/gas_token
  gas_router_token:
    file: ./secrets/gas_router_token
  gas_roster_url:
    file: ./secrets/gas_roster_url
  gas_scelte_url:
    file: ./secrets/gas_scelte_url
  yahoo_client_id:
    file: ./secrets/yahoo_client_id
  yahoo_client_secret:
    file: ./secrets/yahoo_client_secret
  yahoo_router_token:
    file: ./secrets/yahoo_router_token

volumes:
  pgdata:
  aste_beta_data:
  yahoo_data:
